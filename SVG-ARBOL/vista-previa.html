function mostrar(){const n=Number(paso.value);arbol.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(frames[n-1]);arbol.alt='Árbol, fotograma '+n+' de 30';estado.textContent=n+' de 30';paso.setAttribute('aria-valuetext',estado.textContent)}
