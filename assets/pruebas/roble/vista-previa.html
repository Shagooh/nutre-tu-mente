    const colores = [
      { nombre: 'Verde', tono: 88, saturacion: 47, luz: 49 },
      { nombre: 'Amarillo', tono: 47, saturacion: 82, luz: 62 },
      { nombre: 'Lila', tono: 270, saturacion: 40, luz: 72 },
      { nombre: 'Naranjo', tono: 27, saturacion: 82, luz: 60 },
      { nombre: 'Morado', tono: 285, saturacion: 40, luz: 55 },
      { nombre: 'Celeste', tono: 197, saturacion: 65, luz: 71 },
      { nombre: 'Rojo', tono: 5, saturacion: 65, luz: 60 },
      { nombre: 'Beige', tono: 38, saturacion: 40, luz: 74 },
      { nombre: 'Azul', tono: 220, saturacion: 55, luz: 59 },
      { nombre: 'Blanco perla', tono: 45, saturacion: 20, luz: 91 }
    ];
    const paso = document.querySelector('#paso');
    const color = document.querySelector('#color');
    const arbol = document.querySelector('#arbol');
    const estado = document.querySelector('#estado');
    const nombreColor = document.querySelector('#nombre-color');
    const muestra = document.querySelector('#muestra');

    function mostrar() {
      const indice = Number(paso.value);
      const elegido = colores[Number(color.value)];
      const pintar = (variacion) => 'hsl(' + elegido.tono + ', ' + elegido.saturacion + '%, ' + Math.max(15, Math.min(97, elegido.luz + variacion)) + '%)';
      const tonos = {
        '#83b943': pintar(0), '#4b812e': pintar(-17),
        '#badd64': pintar(18), '#bedf69': pintar(21),
        '#354324': pintar(-32), '#456d2b': pintar(-25),
        '#a8c35c': pintar(7), '#bbd36d': pintar(14),
        '#475432': pintar(-29), '#6c8e41': pintar(-17)
      };
      const svg = fotogramas[indice].replace(/#[0-9a-f]{6}/gi, (hex) => tonos[hex.toLowerCase()] || hex);
      arbol.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
      arbol.alt = etiquetas[indice] + '. Hojas de color ' + elegido.nombre.toLowerCase() + '.';
      estado.textContent = (indice + 1) + ' de 5 · ' + etiquetas[indice];
      nombreColor.textContent = elegido.nombre;
      muestra.style.backgroundColor = pintar(0);
      paso.setAttribute('aria-valuetext', etiquetas[indice]);
      color.setAttribute('aria-valuetext', elegido.nombre);
    }
    paso.addEventListener('input', mostrar);
    color.addEventListener('input', mostrar);
    mostrar();
  </script>
</body>
</html>
