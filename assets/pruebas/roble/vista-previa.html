<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prueba de crecimiento del roble</title><style>body{font:1rem system-ui;color:#304633;background:#faf9f2;max-width:620px;margin:3em auto;padding:0 1em}img{width:min(100%,420px);height:auto;display:block}input{width:min(100%,420px)}output{display:block;margin:.7em 0}</style><h1>Crecimiento del roble</h1><img id="arbol" src="roble-00.svg" alt="Semilla con cotiledones"><label for="paso">Fotograma</label><output id="estado" for="paso"></output><input type="range" id="paso" min="0" max="4" value="0" step="1"><script>const nombres=["roble-00.svg","roble-01.svg","roble-02.svg","roble-03.svg","roble-04.svg"], etiquetas=['Semilla con cotiledones','Una hoja verdadera','Dos hojas verdaderas','Tres hojas verdaderas','Cinco hojas verdaderas'];const paso=document.querySelector('#paso'), arbol=document.querySelector('#arbol'), estado=document.querySelector('#estado');function mostrar(){const i=Number(paso.value);arbol.src=nombres[i];arbol.alt=etiquetas[i];estado.textContent=(i+1)+' de 5 · '+etiquetas[i]}paso.oninput=mostrar;mostrar()</script></html>
