name: CI

# Se ejecuta en cada push a main y en cada Pull Request.
on:
  push:
    branches: [main]
  pull_request:

# Si llega un cambio nuevo, cancela la ejecución anterior de la misma rama.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Instalar y compilar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar que el proyecto Expo esté sano
        run: npx expo-doctor
        continue-on-error: true # informa, pero no bloquea

      - name: Compilar la versión web
        run: npx expo export --platform web

      - name: Compilar el paquete de Android (detecta errores de código)
        run: npx expo export --platform android --output-dir dist-android

      - name: Guardar la versión web para descargarla
        uses: actions/upload-artifact@v4
        with:
          name: nutre-tu-mente-web
          path: dist
          retention-days: 7
