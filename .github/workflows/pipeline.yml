name: Pipeline

# Una sola rama permanente: main. Desde main (o desde un hotfix/...) se ELIGE el destino.
#
#   Pull Request hacia main  -> prueba y compila (no publica).
#   Push a main              -> prueba, compila y publica AUTOMÁTICAMENTE en staging.
#   Ejecución manual         -> Actions > Pipeline > "Run workflow": eliges la rama (main o hotfix/...)
#                               y el entorno (staging o produccion).
#                               Producción exige la aprobación del entorno "Production".
#
# La versión de la app vive en package.json. Cada publicación a producción necesita una versión NUEVA y deja una
# etiqueta vX.Y.Z (no se puede repetir): así se sabe qué hay en producción y de ahí sale un hotfix
# (scripts/crear-hotfix.sh). Detalle en docs/FLUJO-DE-RAMAS.md y docs/VERSIONES.md.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      entorno:
        description: "Dónde publicar"
        type: choice
        options:
          - staging
          - produccion
        default: staging

# Solo los Pull Request cancelan la ejecución anterior. Una publicación nunca se cancela por otra rama.
concurrency:
  group: pipeline-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # 0) Decide A DÓNDE se publica y comprueba que sea seguro (rama permitida, hotfix limpio, nada que se pierda).
  destino:
    name: 0 · Destino
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      entorno: ${{ steps.destino.outputs.entorno }}
      publica: ${{ steps.destino.outputs.publica }}
      version: ${{ steps.destino.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historial y etiquetas completos
      - name: Decidir y validar el destino
        id: destino
        # Los nombres de rama los escribe cada persona: se pasan por entorno, nunca dentro del script.
        env:
          EVENTO: ${{ github.event_name }}
          ENTORNO_PEDIDO: ${{ inputs.entorno }}
          RAMA: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: bash .github/scripts/validar-destino.sh

  # 1) Pruebas automáticas de la lógica de la app y validación de las especificaciones
  probar:
    name: 1 · Probar
    needs: destino
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validar la versión (package.json y package-lock.json)
        run: node .github/scripts/validar-version.js
      - name: Pruebas
        run: npm test -- --ci
      - name: Validar las especificaciones (OpenSpec)
        env:
          OPENSPEC_TELEMETRY: '0'
        run: npx --yes @fission-ai/openspec@1.14.3 validate --all --strict --no-interactive

  # 2) Compilar web y Android (detecta errores de código y de dependencias)
  compilar:
    name: 2 · Compilar
    needs: [destino, probar]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Configuración pública de Firebase (no son secretos), en Settings > Secrets and variables >
    # Actions > pestaña "Variables". El script elige staging o producción según ENTORNO.
    env:
      ENTORNO: ${{ needs.destino.outputs.entorno }}
      # Staging (variables que ya existían) y producción (con prefijo PROD_).
      STG_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
      STG_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      STG_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      STG_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
      STG_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      PROD_API_KEY: ${{ vars.PROD_EXPO_PUBLIC_FIREBASE_API_KEY }}
      PROD_AUTH_DOMAIN: ${{ vars.PROD_EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      PROD_PROJECT_ID: ${{ vars.PROD_EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      PROD_APP_ID: ${{ vars.PROD_EXPO_PUBLIC_FIREBASE_APP_ID }}
      PROD_MESSAGING_SENDER_ID: ${{ vars.PROD_EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Elegir la configuración de Firebase (staging o producción)
        run: bash .github/scripts/elegir-firebase.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Revisar el proyecto Expo (informa, no bloquea)
        run: npx expo-doctor
        continue-on-error: true
      - name: Compilar versión web
        run: npx expo export --platform web
      - name: Compilar paquete de Android
        run: npx expo export --platform android --output-dir dist-android
      - name: Guardar la versión web para descargarla
        uses: actions/upload-artifact@v4
        with:
          name: nutre-tu-mente-web
          path: dist
          retention-days: 7

  # 3) Publicar en el entorno elegido (staging o producción).
  #    Hay dos proveedores y cada uno se activa SOLO si existen sus claves:
  #      - Vercel   -> VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
  #      - Firebase -> FIREBASE_SERVICE_ACCOUNT, FIREBASE_PROJECT_ID (Google)
  #    Para completar la migración, borra los secrets de Vercel y el paso "Publicar en Vercel".
  publicar:
    name: 3 · Publicar (${{ needs.destino.outputs.entorno }})
    needs: [destino, compilar]
    if: needs.destino.outputs.publica == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # para etiquetar la versión que queda en producción
    # Una publicación a producción nunca se cancela; una a staging puede ser reemplazada por otra más nueva.
    concurrency:
      group: publicar-${{ needs.destino.outputs.entorno }}
      cancel-in-progress: ${{ needs.destino.outputs.entorno == 'staging' }}
    # Crea el registro en la sección "Deployments" de GitHub y habilita
    # la aprobación manual en el entorno "Production".
    environment:
      name: ${{ needs.destino.outputs.entorno == 'produccion' && 'Production' || 'staging' }}
      url: ${{ steps.firebase.outputs.details_url || steps.desplegar.outputs.url }}
    env:
      ENTORNO: ${{ needs.destino.outputs.entorno }}
      VERSION: ${{ needs.destino.outputs.version }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      STAGING_ALIAS: nutre-tu-mente-staging.vercel.app
      # Staging (variables que ya existían) y producción (con prefijo PROD_).
      STG_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
      STG_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      STG_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      STG_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
      STG_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      PROD_API_KEY: ${{ vars.PROD_EXPO_PUBLIC_FIREBASE_API_KEY }}
      PROD_AUTH_DOMAIN: ${{ vars.PROD_EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      PROD_PROJECT_ID: ${{ vars.PROD_EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      PROD_APP_ID: ${{ vars.PROD_EXPO_PUBLIC_FIREBASE_APP_ID }}
      PROD_MESSAGING_SENDER_ID: ${{ vars.PROD_EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      # "true" si el secret de Firebase existe (así el secret no se expone a los demás pasos).
      HAY_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && secrets.FIREBASE_PROJECT_ID != '' }}
    steps:
      - name: Aviso si no hay ningún proveedor configurado
        if: env.VERCEL_TOKEN == '' && env.HAY_FIREBASE != 'true'
        run: |
          echo "No hay claves de Vercel ni de Firebase, se omite la publicación (no es un error)."
      - uses: actions/checkout@v4
      - name: Elegir la configuración de Firebase (staging o producción)
        run: bash .github/scripts/elegir-firebase.sh

      # --- Google Firebase Hosting ---------------------------------------------
      # Publica exactamente la versión web que se compiló en la etapa 2.
      - name: Descargar la versión web compilada
        if: env.HAY_FIREBASE == 'true'
        uses: actions/download-artifact@v4
        with:
          name: nutre-tu-mente-web
          path: dist
      - name: Publicar en Firebase
        id: firebase
        if: env.HAY_FIREBASE == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          # producción -> canal "live"; staging -> canal fijo "staging" (caduca a los 30 días sin publicar).
          channelId: ${{ needs.destino.outputs.entorno == 'produccion' && 'live' || 'staging' }}
          expires: 30d

      # --- Vercel (se puede borrar al terminar la migración) --------------------
      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        if: env.VERCEL_TOKEN != ''
        run: npm ci
      - name: Publicar en Vercel
        id: desplegar
        if: env.VERCEL_TOKEN != ''
        run: |
          VERCEL="npx --yes vercel@65.0.0"
          if [ "$ENTORNO" = "produccion" ]; then
            $VERCEL pull --yes --environment=production --token="$VERCEL_TOKEN"
            $VERCEL build --prod --token="$VERCEL_TOKEN"
            url=$($VERCEL deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tail -n 1)
          else
            $VERCEL pull --yes --environment=preview --token="$VERCEL_TOKEN"
            $VERCEL build --token="$VERCEL_TOKEN"
            url=$($VERCEL deploy --prebuilt --token="$VERCEL_TOKEN" | tail -n 1)
            # Dirección fija para staging (si falla, se usa la del despliegue).
            if salida=$($VERCEL alias set "$url" "$STAGING_ALIAS" --token="$VERCEL_TOKEN" 2>&1); then
              url="https://$STAGING_ALIAS"
            else
              echo "$salida"
              echo "::warning::No se pudo crear el alias de staging (se usa la dirección del despliegue). Motivo: $(echo "$salida" | tr -s '[:space:]' ' ' | cut -c1-600)"
            fi
          fi
          echo "Publicado en: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      # --- Registrar qué versión quedó en producción ---------------------------
      # La etiqueta vX.Y.Z es la referencia de la que debe salir un hotfix, y no se puede repetir.
      - name: Etiquetar la versión que quedó en producción
        if: needs.destino.outputs.entorno == 'produccion' && (steps.desplegar.outcome == 'success' || steps.firebase.outcome == 'success')
        run: |
          etiqueta="v$VERSION"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$etiqueta" -m "Versión $VERSION en producción: $GITHUB_SHA (rama $GITHUB_REF_NAME, ejecución $GITHUB_RUN_ID, por $GITHUB_ACTOR)" "$GITHUB_SHA"
          git push origin "$etiqueta"
          echo "Etiqueta creada: $etiqueta"
          echo "### Producción actualizada" >> "$GITHUB_STEP_SUMMARY"
          echo "Versión **$VERSION** (\`${GITHUB_SHA:0:7}\`) publicada. Etiqueta: \`$etiqueta\`." >> "$GITHUB_STEP_SUMMARY"
