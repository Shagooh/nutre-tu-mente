name: Pipeline

# Etapas: probar → compilar → publicar.
#   Pull Request  → solo prueba y compila (no publica).
#   rama staging  → publica en el entorno de pruebas (UAT).
#   rama main     → publica en producción (con aprobación manual si se configura
#                   "Required reviewers" en Settings → Environments → production).
on:
  push:
    branches: [main, staging]
  pull_request:

# Una ejecución nueva cancela la anterior de la misma rama, salvo en main
# (para no cortar una publicación a producción a la mitad).
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # 1) Pruebas automáticas de la lógica de la app
  probar:
    name: 1 · Probar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas
        run: npm test -- --ci

  # 2) Compilar web y Android (detecta errores de código y de dependencias)
  compilar:
    name: 2 · Compilar
    needs: probar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Revisar el proyecto Expo (informa, no bloquea)
        run: npx expo-doctor
        continue-on-error: true
      - name: Compilar versión web
        run: npx expo export --platform web
      - name: Compilar paquete de Android
        run: npx expo export --platform android --output-dir dist-android
      - name: Guardar la versión web para descargarla
        uses: actions/upload-artifact@v4
        with:
          name: nutre-tu-mente-web
          path: dist
          retention-days: 7

  # 3) Publicar en Vercel: staging o producción según la rama.
  #    Se omite sola si no existen las claves (VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID).
  #    Para cambiar de proveedor, reemplaza solo el paso "Publicar".
  publicar:
    name: 3 · Publicar (${{ github.ref_name == 'main' && 'producción' || 'staging' }})
    needs: compilar
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Crea el registro en la sección "Deployments" de GitHub y habilita
    # la aprobación manual en el entorno "production".
    environment:
      name: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      url: ${{ steps.desplegar.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      STAGING_ALIAS: nutre-tu-mente-staging.vercel.app
      VERCEL_SCOPE: shagoohs-projects # nombre del equipo en Vercel (no es un secreto)
    steps:
      - name: Aviso si faltan las claves
        if: env.VERCEL_TOKEN == ''
        run: |
          echo "No hay VERCEL_TOKEN, se omite la publicación (no es un error)."
      - uses: actions/checkout@v4
        if: env.VERCEL_TOKEN != ''
      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        if: env.VERCEL_TOKEN != ''
        run: npm ci
      - name: Publicar
        id: desplegar
        if: env.VERCEL_TOKEN != ''
        run: |
          VERCEL="npx --yes vercel@65.0.0"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            $VERCEL pull --yes --environment=production --token="$VERCEL_TOKEN"
            $VERCEL build --prod --token="$VERCEL_TOKEN"
            url=$($VERCEL deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tail -n 1)
          else
            $VERCEL pull --yes --environment=preview --token="$VERCEL_TOKEN"
            $VERCEL build --token="$VERCEL_TOKEN"
            url=$($VERCEL deploy --prebuilt --token="$VERCEL_TOKEN" | tail -n 1)
            # Dirección fija para staging (si falla, se usa la del despliegue).
            if salida=$($VERCEL alias set "$url" "$STAGING_ALIAS" --token="$VERCEL_TOKEN" --scope="$VERCEL_SCOPE" 2>&1); then
              url="https://$STAGING_ALIAS"
            else
              echo "::warning::No se pudo crear el alias de staging (se usa la dirección del despliegue): $salida"
            fi
          fi
          echo "Publicado en: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
