name: Pipeline

# Etapas: probar → compilar → publicar.
#   Pull Request  → solo prueba y compila (no publica).
#   rama staging  → publica en el entorno de pruebas (UAT).
#   rama main     → publica en producción (con aprobación manual si se configura
#                   "Required reviewers" en Settings → Environments → Production).
on:
  push:
    branches: [main, staging]
  pull_request:

# Una ejecución nueva cancela la anterior de la misma rama, salvo en main
# (para no cortar una publicación a producción a la mitad).
concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # 1) Pruebas automáticas de la lógica de la app
  probar:
    name: 1 · Probar
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Pruebas
        run: npm test -- --ci

  # 2) Compilar web y Android (detecta errores de código y de dependencias)
  compilar:
    name: 2 · Compilar
    needs: probar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Configuración pública de Firebase (no son secretos). Se define en
    # Settings → Secrets and variables → Actions → pestaña "Variables".
    # Si no existen, la app se compila en modo local (sin cuentas ni nube).
    env:
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Revisar el proyecto Expo (informa, no bloquea)
        run: npx expo-doctor
        continue-on-error: true
      - name: Compilar versión web
        run: npx expo export --platform web
      - name: Compilar paquete de Android
        run: npx expo export --platform android --output-dir dist-android
      - name: Guardar la versión web para descargarla
        uses: actions/upload-artifact@v4
        with:
          name: nutre-tu-mente-web
          path: dist
          retention-days: 7

  # 3) Publicar: staging o producción según la rama.
  #    Hay dos proveedores y cada uno se activa SOLO si existen sus claves:
  #      · Vercel   → VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
  #      · Firebase → FIREBASE_SERVICE_ACCOUNT, FIREBASE_PROJECT_ID (Google)
  #    Para completar la migración, borra los secrets de Vercel y el paso "Publicar en Vercel".
  publicar:
    name: 3 · Publicar (${{ github.ref_name == 'main' && 'producción' || 'staging' }})
    needs: compilar
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/staging')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Crea el registro en la sección "Deployments" de GitHub y habilita
    # la aprobación manual en el entorno "Production".
    environment:
      name: ${{ github.ref_name == 'main' && 'Production' || 'staging' }}
      url: ${{ steps.firebase.outputs.details_url || steps.desplegar.outputs.url }}
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      STAGING_ALIAS: nutre-tu-mente-staging.vercel.app
      # Configuración pública de Firebase: "vercel build" compila por su cuenta y la necesita.
      EXPO_PUBLIC_FIREBASE_API_KEY: ${{ vars.EXPO_PUBLIC_FIREBASE_API_KEY }}
      EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.EXPO_PUBLIC_FIREBASE_AUTH_DOMAIN }}
      EXPO_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_PROJECT_ID }}
      EXPO_PUBLIC_FIREBASE_APP_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_APP_ID }}
      EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.EXPO_PUBLIC_FIREBASE_MESSAGING_SENDER_ID }}
      # "true" si el secret de Firebase existe (así el secret no se expone a los demás pasos).
      HAY_FIREBASE: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && secrets.FIREBASE_PROJECT_ID != '' }}
    steps:
      - name: Aviso si no hay ningún proveedor configurado
        if: env.VERCEL_TOKEN == '' && env.HAY_FIREBASE != 'true'
        run: |
          echo "No hay claves de Vercel ni de Firebase, se omite la publicación (no es un error)."
      - uses: actions/checkout@v4

      # --- Google Firebase Hosting ---------------------------------------------
      # Publica exactamente la versión web que se compiló en la etapa 2.
      - name: Descargar la versión web compilada
        if: env.HAY_FIREBASE == 'true'
        uses: actions/download-artifact@v4
        with:
          name: nutre-tu-mente-web
          path: dist
      - name: Publicar en Firebase
        id: firebase
        if: env.HAY_FIREBASE == 'true'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}
          # main → canal "live" (producción); staging → canal fijo "staging" (caduca a los 30 días sin publicar).
          channelId: ${{ github.ref_name == 'main' && 'live' || 'staging' }}
          expires: 30d

      # --- Vercel (se puede borrar al terminar la migración) --------------------
      - uses: actions/setup-node@v4
        if: env.VERCEL_TOKEN != ''
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        if: env.VERCEL_TOKEN != ''
        run: npm ci
      - name: Publicar en Vercel
        id: desplegar
        if: env.VERCEL_TOKEN != ''
        run: |
          VERCEL="npx --yes vercel@65.0.0"
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            $VERCEL pull --yes --environment=production --token="$VERCEL_TOKEN"
            $VERCEL build --prod --token="$VERCEL_TOKEN"
            url=$($VERCEL deploy --prebuilt --prod --token="$VERCEL_TOKEN" | tail -n 1)
          else
            $VERCEL pull --yes --environment=preview --token="$VERCEL_TOKEN"
            $VERCEL build --token="$VERCEL_TOKEN"
            url=$($VERCEL deploy --prebuilt --token="$VERCEL_TOKEN" | tail -n 1)
            # Dirección fija para staging (si falla, se usa la del despliegue).
            if salida=$($VERCEL alias set "$url" "$STAGING_ALIAS" --token="$VERCEL_TOKEN" 2>&1); then
              url="https://$STAGING_ALIAS"
            else
              echo "$salida"
              echo "::warning::No se pudo crear el alias de staging (se usa la dirección del despliegue). Motivo: $(echo "$salida" | tr -s '[:space:]' ' ' | cut -c1-600)"
            fi
          fi
          echo "Publicado en: $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
