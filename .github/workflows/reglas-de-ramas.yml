name: Reglas de ramas

# Valida el nombre de la rama de cada Pull Request y, en un hotfix, que parta de lo que está en producción.
# Solo existen feature/ y hotfix/, y todo va hacia main. Convención y flujo: docs/FLUJO-DE-RAMAS.md
on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
    branches: [main]

permissions:
  contents: read

jobs:
  ramas:
    name: 0 · Reglas de ramas
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historial y etiquetas completos (para comprobar de dónde sale un hotfix)
      - name: Validar la rama
        # Los nombres de rama los escribe cada persona: se pasan por entorno, nunca dentro del script.
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/scripts/validar-ramas.sh
